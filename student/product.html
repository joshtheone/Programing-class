<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="product.css" />
    <!-- Basic Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="logo.png" alt="" />

      <!-- search section  -->
      <div class="search-section">
        <div class="">
          <select class="input categories" name="" id="">
            <option value="">All</option>
            <option value="">Clothing</option>
            <option value="">Electronics</option>
            <option value="">Books</option>
          </select>
        </div>
        <div class="">
          <input
            type="text"
            class="input select"
            placeholder="Search for products"
          />
        </div>
        <div class="seach-block">
          <button class="btn-search"><i class="bx bx-search"></i></button>
        </div>
      </div>

      <!--  -->
      <div class="">
        <button class="btn btn-orange" title="Language"><i class="bx bx-translate icon" ></i></button>
        <button class="btn btn-orange"><i class="bx bx-cart-alt-2 icon" ></i></button>
        <button class="btn btn-orange">Login</button>
      </div>
    </header>
  </body>
</html>
