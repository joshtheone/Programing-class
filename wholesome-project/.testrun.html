<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>

  
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 flex items-center justify-center min-h-screen">

  <div class="bg-white w-96 p-6 rounded-xl shadow-lg">
    <h2 class="text-xl font-bold mb-4">Todo App</h2>

    <ul id="taskList" class="space-y-3">
      <li class="flex justify-between items-center bg-gray-100 p-3 rounded">
        <span>Sample Task 1</span>
        <div class="space-x-2">
          <button class="bg-green-500 text-white px-3 py-1 rounded done-btn">Done</button>
          <button class="bg-red-500 text-white px-3 py-1 rounded delete-btn">Delete</button>
        </div>
      </li>
    </ul>

    <div class="flex mt-4">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Add a new task..."
        class="flex-1 border rounded-l px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
      <button 
        id="addBtn"
        class="bg-blue-500 text-white px-4 rounded-r hover:bg-blue-600"
      >
        Add
      </button>
    </div>
  </div>

  <!-- Link External JS -->
  <script src="testrun.js"></script>

</body>
</html>
