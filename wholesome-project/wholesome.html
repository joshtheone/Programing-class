<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wholesome greens</title>
  <link rel="stylesheet" href="wholesome.css">
  <!--Basic icons  -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet" />
</head>

<body>
  <header class="header">

    <div class="logo group">
      <button class="menu-btn" id="menu-toggle"><i class="bx bx-menu"></i></button>>
      <img class="logo"
        src="https://www.pngitem.com/pimgs/m/533-5338659_logo-vegetable-home-delivery-logo-png-transparent-png.png"
        alt="" />
    </div>
    <h1>Wholesome Greens</h1>


    <!-- search section -->
    <div class="search-section">
      <div class="">
        <select class="input categories" name="" id="">
          <option value="">All</option>
          <option value="">vegetables</option>
          <option value="">fruits</option>
        </select>
      </div>
      <div class="">
        <input type="text" id="searchInput" class="input select" placeholder="search for products" />
      </div>
      <div class="seach block">
        <button class="btn search"><i class="bx bx-search"></i></button>
      </div>
    </div>


    <!--  -->
    <div class="">
      <button class="btn btn red" title="language"><i class="bx bx-translate icon"></i></button>
      <button class="btn btn-red"><i class="bx bx-cart-alt-2 icon"></i></button>
      <button class="btn btn-red">Login</button>
    </div>
  </header>


  <nav class="side-bar" id="side-bar">
    <ul class="nav-list">
      <li class="nav-item"><a href="#">Home</a></li>
      <li class="nav-item"><a href="#">Shop</a></li>
      <li class="nav-item"><a href="#">About</a></li>
      <li class="nav-item"><a href="#">Contact</a></li>
    </ul>
  </nav>
  <main>
    <div class="parent">
      <div class="child"></div>
    </div>

    <p>
      Home of Organic and Fresh Produce.
    </p>

    <img src="mexico.jpg" alt="" />

  </main>

  <br><br><br><br>
  <div class="table" style="margin-bottom: 20px;">
    <!-- <input type="text" placeholder="Filter produce" id="searchInput"> -->
    <button id="searchButton">Search</button>
  </div>

  <table width="50%" border="1" cellpadding="5" cellspacing="0">
    <thead>
      <tr>
        <th>Name</th>
        <th>quantity</th>
        <th>price</th>
      </tr>
    </thead>

    <tbody id="produceTable">

    </tbody>

  </table>

  <script src="wholesome.js"></script>

</body>

</html>
